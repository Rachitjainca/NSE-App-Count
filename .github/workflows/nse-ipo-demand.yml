name: NSE IPO Demand Tracker

on:
  schedule:
    # GitHub's `schedule` trigger is unreliable at 15-minute granularity in practice
    # (observed 4-7 hour gaps despite a `*/15` cron) — it fires far more reliably once
    # per hour. So we fire hourly and loop 4x internally with deterministic sleeps to
    # get real ~15-minute delivery. Offset 5 min past the hour to dodge GitHub's
    # documented top-of-hour congestion. Hours 3-13 UTC cover ~08:35-19:20 IST.
    - cron: "5 3-13 * * 1-5"
  workflow_dispatch:
    inputs:
      symbol:
        description: "IPO symbol to track"
        required: false
        default: "JPL"
      lot_size:
        description: "Retail lot size (for estimated application count)"
        required: false
        default: "12"
      iterations:
        description: "How many ~15-min-spaced fetch/publish cycles to run this call"
        required: false
        default: "1"

concurrency:
  group: nse-ipo-demand
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Reports presence and length only; never echoes secret values.
      - name: Check configuration
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          RETAIL_LOT_SIZE_VAR: ${{ vars.RETAIL_LOT_SIZE }}
        run: |
          for name in GSHEET_ID GOOGLE_SERVICE_ACCOUNT_JSON GCHAT_WEBHOOK_URL; do
            value="${!name}"
            if [ -z "$value" ]; then
              echo "MISSING  $name (secret not visible to this job)"
            else
              echo "ok       $name (${#value} chars)"
            fi
          done
          echo "vars.RETAIL_LOT_SIZE = '${RETAIL_LOT_SIZE_VAR}'"

      - name: Fetch demand and publish (looped every ~15 min for this hour)
        env:
          IPO_SYMBOL: ${{ inputs.symbol || vars.IPO_SYMBOL || 'JPL' }}
          IPO_EXCHANGE: ${{ vars.IPO_EXCHANGE || 'ALL' }}
          IPO_SERIES: ${{ vars.IPO_SERIES || 'EQ' }}
          RETAIL_LOT_SIZE: ${{ inputs.lot_size || vars.RETAIL_LOT_SIZE || '12' }}
          EMPLOYEE_LOT_SIZE: ${{ vars.EMPLOYEE_LOT_SIZE }}
          SHAREHOLDER_LOT_SIZE: ${{ vars.SHAREHOLDER_LOT_SIZE }}
          HNI_LOT_SIZE: ${{ vars.HNI_LOT_SIZE }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GSHEET_WORKSHEET: ${{ vars.GSHEET_WORKSHEET || 'IPO Demand' }}
          GSHEET_BUCKET_WORKSHEET: ${{ vars.GSHEET_BUCKET_WORKSHEET || 'IPO Bid Buckets' }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GCHAT_WEBHOOK_URL: ${{ secrets.GCHAT_WEBHOOK_URL }}
          GCHAT_THREAD_KEY: ${{ vars.GCHAT_THREAD_KEY }}
          RUNS: ${{ github.event_name == 'schedule' && '4' || inputs.iterations || '1' }}
        run: |
          set -e
          for i in $(seq 1 "$RUNS"); do
            echo "::group::Cycle $i of $RUNS"
            python src/main.py
            echo "::endgroup::"
            if [ "$i" -lt "$RUNS" ]; then
              sleep 870  # ~14.5 min; leaves headroom under the 55-min job timeout
            fi
          done
